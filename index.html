<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rose SMM Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      margin-top: 6px;
      opacity: 0.8;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .status {
      padding: 12px;
      background: #eef2ff;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Rose SMM Panel</h1>
    <p>Fast • Secure • Reliable</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Create Demo Order</h2>

      <label for="service">Service</label>
      <select id="service">
        <option>Social Media Analytics</option>
        <option>Content Planning</option>
        <option>Post Scheduling</option>
        <option>Engagement Tracking</option>
      </select>

      <label for="link">Post / Page URL</label>
      <input
        type="url"
        id="link"
        placeholder="https://example.com/your-post"
      >

      <label for="quantity">Quantity</label>
      <input
        type="number"
        id="quantity"
        min="1"
        placeholder="Enter quantity"
      >

      <button onclick="createOrder()">Create Demo Order</button>

      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <h2>Panel Information</h2>
      <p><strong>Panel:</strong> Rose SMM Panel</p>
      <p><strong>Status:</strong> Online</p>
      <p><strong>Mode:</strong> Demo / Testing</p>
    </div>

  </div>

  <footer>
    © 2026 Rose SMM Panel
  </footer>

  <script>
    function createOrder() {
      const link = document.getElementById("link").value;
      const quantity = document.getElementById("quantity").value;
      const status = document.getElementById("status");

      if (!link || !quantity) {
        status.style.display = "block";
        status.textContent = "Please complete all fields.";
        return;
      }

      status.style.display = "block";
      status.textContent =
        "Demo order created successfully. No real social-media action was performed.";
    }
  </script>

</body>
                             </html>
