* {margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#ffd700;padding:15px;min-height:100vh}
.box{max-width:500px;margin:0 auto}
h1{text-align:center;font-size:24px;margin:10px 0 5px;text-shadow:0 0 8px rgba(255,215,0,0.5)}
.sub{text-align:center;color:#ffeb80;margin-bottom:20px;font-size:14px}
.card{background:#0c0c0c;border:2px solid #ffd700;border-radius:16px;padding:20px;margin-bottom:15px}
label{display:block;margin:12px 0 6px;font-weight:bold;color:#ffeb80}
input,select,textarea{width:100%;padding:12px;font-size:15px;border:2px solid #333;border-radius:10px;background:#1a1a1a;color:#fff}
input:focus,select:focus{border-color:#ffd700;box-shadow:0 0 8px rgba(255,215,0,0.4);outline:none}
button{width:100%;margin-top:20px;padding:14px;font-size:18px;font-weight:bold;background:linear-gradient(135deg,#ffd700,#ffb300);color:#000;border:none;border-radius:12px;cursor:pointer}
button:hover{transform:scale(1.02)}
.note{margin-top:15px;font-size:12px;color:#ff9500;text-align:center;line-height:1.5}
.hidden{display:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.cat-btn{background:#1a1a1a;color:#fff;border:1px solid #444;padding:12px;border-radius:10px;font-size:14px;cursor:pointer}
.cat-btn:hover{border-color:#ffd700}

    </div>

    <div>

      <select id="serbisyo">

      <label>🔢 Dami:</label>

        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
        <option value="500">500</option>
        <option value="1000">1,000</option>
      </select>

      <button onclick="ipadala()">📤 I-SEND ANG ORDER</button>
      
      <p class="note">⚠️ Kailangan may pundo sa JT SMM → Add Funds → GCash<br>
      ✅ Magpapadala rin ng abiso sa Telegram mo!</p>

function showSection(name){
  const sel = document.getElementById('serbisyo');
  sel.innerHTML = '<option value="" disabled selected>— Piliin —</option>';
  sections[name].forEach(s=>{
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.name;
    sel.appendChild(opt);
  });
  const showCmt = name === 'comments';
  document.getElementById('cmtLabel').classList.toggle('hidden',!showCmt);
  document.getElementById('komento').classList.toggle('hidden',!showCmt);
}

async function sendTelegram(msg){
  if(!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;
  
  const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
  try{
    await fetch(url, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        text: msg,
        parse_mode: 'Markdown'
      })
    });
  }catch(e){}
}

async function ipadala(){
  const link = document.getElementById('link').value.trim();
  const sid = document.getElementById('serbisyo').value;
  const dami = document.getElementById('dami').value;
  const komento = document.getElementById('komento').value.trim();
  
  if(!link){alert("⚠️ Ilagay ang link!");return}
  if(!sid){alert("⚠️ Pumili muna sa itaas!");return}
  
  const btn = event.target;
  btn.innerText = "⏰ NAGPAPADALA..."; btn.disabled = true;
  
  const fd = new FormData();
  fd.append('key', PROVIDER.apiKey);
  fd.append('action', 'add');
  fd.append('service', sid);
  fd.append('link', link);
  fd.append('quantity', dami);
  if(komento) fd.append('comments', komento);
  
  try{
    const res = await fetch(PROVIDER.apiUrl, {method:'POST', body:fd});
    const data = await res.json();
    
    if(data.order){
      const serbisyoPangalan = document.getElementById('serbisyo').selectedOptions[0].text;
      const mensahe = `✅ *BAGONG ORDER!*\n\n🆔 Order #: ${data.order}\n📋 Serbisyo: ${serbisyoPangalan}\n🔗 Link: ${link}\n🔢 Dami: ${dami}`;
      await sendTelegram(mensahe);
      
      alert(`✅ MATAGUMPAY!\n🆔 Order #: ${data.order}\nAbisuhan ka rin sa Telegram!`);
      document.getElementById('link').value = "";
      document.getElementById('komento').value = "";
    }else{
      alert("❌ MALI: " + (data.error || "Walang pundo? Tignan ang Minimum!"));
    }
  }catch(e){
    alert("❌ ERROR: " + e.message);
  }
  
  btn.innerText = "📤 I-SEND ANG ORDER"; btn.disabled = false;
}
