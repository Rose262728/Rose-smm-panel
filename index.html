<!DOCTYPE html>
<html lang="tl">
<head>

  <title>🌹 ROSE SMM PANEL — MALINAW</title>
  <style>
* {box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#000;color:#ffd700;padding:20px 15px;min-height:100vh}
.container{max-width:540px;margin:0 auto}
h1{text-align:center;font-size:24px;margin-bottom:5px;text-shadow:0 0 10px rgba(255,215,0,0.5)}
.subtitle{text-align:center;color:#ffeb80;margin-bottom:20px;font-size:14px}
.card{background:#111;border:2px solid #ffd700;border-radius:15px;padding:20px;margin-bottom:15px;box-shadow:0 0 15px rgba(255,215,0,0.2)}
.card h2{font-size:17px;margin-bottom:15px;text-align:center;color:#fff}
label{display:block;margin:12px 0 6px;font-weight:bold;color:#ffeb80;font-size:14px}
input,select,textarea{width:100%;padding:12px;font-size:14px;border:2px solid #444;border-radius:10px;background:#222;color:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#ffd700;box-shadow:0 0 8px rgba(255,215,0,0.4)}
button{width:100%;margin-top:20px;padding:15px;font-size:18px;font-weight:bold;background:linear-gradient(135deg,#ffd700,#ffb300);color:#000;border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 15px rgba(255,215,0,0.4)}
button:hover{transform:scale(1.03)}
button:disabled{opacity:0.7;cursor:not-allowed}
.note{margin-top:12px;font-size:12px;color:#ff9500;text-align:center;line-height:1.5}
.optgroup{color:#ff6b6b;font-weight:bold}
  </style>
</head>
<body>

<div class="container">
  <h1>🌹 ROSE SMM PANEL</h1>
  <p class="subtitle">MALINAW • MADALI • HINDI NAKAKAPAGOD</p>

  <div class="card">

      <option value="ph_angry_6300">😡 Angry | Min:50 | ₱125/1k</option>
      <option value="phs_love_7063">⚡ Love — Mabilis | Min:10 | ₱194/1k</option>
      <option value="phs_care_7064">⚡ Care — Mabilis | Min:10 | ₱194/1k</option>
      <option value="phs_wow_7065">⚡ Wow — Mabilis | Min:10 | ₱194/1k</option>
      <option value="phs_haha_7066">⚡ Haha — Mabilis | Min:10 | ₱194/1k</option>
      <option value="phs_sad_7067">⚡ Sad — Mabilis | Min:10 | ₱194/1k</option>
      <option value="phs_angry_7068">⚡ Angry — Mabilis | Min:10 | ₱194/1k</option>
      
      <option disabled class="optgroup">━━━ 🇵🇭 PILIPINAS — COMMENTS ━━━</option>

      <option value="bd_love_4456">❤️ Love | Min:50 | ₱39/1k</option>
      <option value="bd_care_4457">🤗 Care | Min:50 | ₱39/1k</option>

      <option value="fb_cmt_6386">💬 Comments Custom | Min:50 | ₱118/1k</option>
      <option value="fb_cmt_6388">💬 Comments Random | Min:50 | ₱118/1k</option>
      
      <option disabled class="optgroup">━━━ 👤 MURANG FOLLOWERS ━━━</option>
      <option value="fb_fol_4">Walang Refill | Min:100 | ₱10.46/1k</option>
      <option value="fb_fol_5476">30 Araw Refill | Min:100 | ₱11.33/1k</option>
      <option value="fb_fol_1675">60 Araw Refill | Min:100 | ₱11.92/1k</option>
      <option value="fb_fol_5475">90 Araw Refill | Min:100 | ₱12.50/1k</option>

    <label>💬 Komento (kung Comments ang pinili):</label>
    <textarea id="komento" rows="3" placeholder="Isulat dito ang gusto mong komento...&#10;Isa sa bawat linya"></textarea>

    <label>🔢 Bilang / Dami:</label>
    <select id="dami">
      <option value="10">10</option>
      <option value="50">50</option>
      <option value="100" selected>100</option>
      <option value="200">200</option>
      <option value="500">500</option>
      <option value="1000">1,000</option>
    </select>

    <button onclick="ipadala()">📤 SEND ORDER</button>
    <p class="note">⚠️ Kailangan may pundo sa JT SMM → Add Funds → GCash<br>
    ⚠️ Tignan ang MINIMUM bago magpadala!</p>
  </div>
</div>

<script>
const serviceMap = {
  // PH — Followers
  ph_fol_6292: 6292,
  // PH — Likes
  ph_like_fol_6293: 6293,
  ph_postlike_6294: 6294,
  phs_like_7062: 7062,
  // PH — Reactions
  ph_love_6295: 6295,
  ph_care_6296: 6296,
  ph_wow_6297: 6297,
  ph_haha_6298: 6298,
  ph_sad_6299: 6299,
  ph_angry_6300: 6300,
  phs_love_7063: 7063,
  phs_care_7064: 7064,
  phs_wow_7065: 7065,
  phs_haha_7066: 7066,
  phs_sad_7067: 7067,
  phs_angry_7068: 7068,
  // PH — Comments
  ph_cmt_rnd_6301: 6301,
  ph_cmt_cus_6302: 6302,
  // BD — Mura
  bd_like_4455: 4455,
  bd_love_4456: 4456,
  bd_care_4457: 4457,
  bd_wow_4458: 4458,
  bd_haha_4459: 4459,
  bd_sad_4460: 4460,
  bd_angry_4461: 4461,
  fb_cmt_6386: 6386,
  fb_cmt_6388: 6388,
  // Murang Followers
  fb_fol_4: 4,
  fb_fol_5476: 5476,
  fb_fol_1675: 1675,
  fb_fol_5475: 5475,
  fb_fol_2141: 2141,
  fb_fol_3241: 3241,
  // TikTok
  tt_like_3029: 3029,
  tt_like_2948: 2948,
  tt_like_1996: 1996
};

const PROVIDER = {
  name: "JT SMM Panel",
  apiUrl: "https://jtsmmpanel.com/api/v2",
  apiKey: "ff5746c98eb8860003686df257b8c8c3bfacfd25"
};

async function ipadala() {
  const link = document.getElementById('link').value.trim();
  const serbisyo = document.getElementById('serbisyo').value;
  const dami = document.getElementById('dami').value;
  const komento = document.getElementById('komento').value.trim();

  if (!link) { alert("⚠️ Ilagay ang link muna!"); return; }

  const serviceId = serviceMap[serbisyo];
  if (!serviceId) { alert("⚠️ Pumili ng serbisyo!"); return; }

  const btn = event.target;
  btn.innerText = "⏰ NAGPAPADALA...";
  btn.disabled = true;

  const formData = new FormData();
  formData.append('key', PROVIDER.apiKey);
  formData.append('action', 'add');
  formData.append('service', serviceId);
  formData.append('link', link);
  formData.append('quantity', dami);
  
  if (komento) {
    formData.append('comments', komento);
  }

  try {
    const res = await fetch(PROVIDER.apiUrl, { method: 'POST', body: formData });
    const data = await res.json();
    
    if (data.order) {
      alert(`✅ MATAGUMPAY!\n🆔 Order #: ${data.order}\nTingnan sa JT SMM → Orders`);
      document.getElementById('link').value = "";
      document.getElementById('komento').value = "";
    } else {
      alert("❌ MALI: " + (data.error || "Walang pundo? Tignan ang Minimum!"));
    }
  } catch (err) {
    alert("❌ ERROR: " + err.message);
  }

  btn.innerText = "📤 SEND ORDER";
  btn.disabled = false;
}
</script>

</body>
</html>
