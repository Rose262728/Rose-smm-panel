<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging in...</title>
    <style>
        body {
            background: black;
            color: gold;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .loading { font-size: 22px; }
    </style>
</head>
<body>
    <h1>✅ RoseSMM</h1>
    <p class="loading">Naglo-load... Ibabalik ka sa panel agad.</p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        
        if (code) {
            localStorage.setItem('fb_auth_code', code);
            window.location.href = 'index.html?success=1';
        } else {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
