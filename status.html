<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status - RK Digital</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: black;
            color: gold;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 15px;
            margin: 0;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 35px;
        }

        #statusForm {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        #orderId {
            width: 90%;
            max-width: 450px;
            box-sizing: border-box;
            padding: 18px;
            font-size: 20px;
            border-radius: 10px;
            border: 2px solid gold;
            text-align: center;
        }

        button {
            width: 90%;
            max-width: 300px;
            padding: 16px;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            background: gold;
            color: black;
            border: none;
            border-radius: 10px;
        }

        #result {
            font-size: 20px;
            margin: 25px auto;
            max-width: 500px;
        }

        .btn {
            display: inline-block;
            width: 90%;
            max-width: 300px;
            box-sizing: border-box;
            padding: 16px;
            margin-top: 15px;
            background: gold;
            color: black;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            #orderId {
                font-size: 18px;
                padding: 16px;
            }

            button,
            .btn {
                font-size: 18px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <h1>Check Order Status</h1>

    <form id="statusForm">

        <input
            type="text"
            id="orderId"
            placeholder="Enter Order ID"
            required
        >

        <br>

        <button type="submit">Check Status</button>

    </form>

    <div id="result"></div>

    <a href="index.html" class="btn">Back Home</a>

    <script>
        document.getElementById("statusForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const orderId = document.getElementById("orderId").value.trim();
            const result = document.getElementById("result");

            if (!orderId) {
                result.textContent = "Please enter your Order ID.";
                return;
            }

            result.textContent = "Checking status...";

            try {

                const response = await fetch(
                    "/api/status?orderId=" + encodeURIComponent(orderId)
                );

                const data = await response.json();

                if (response.ok) {

                    result.innerHTML =
                        "<p>🆔 Order ID: " + data.orderId + "</p>" +
                        "<p>📊 Status: " + data.status + "</p>" +
                        "<p>ℹ️ " + data.message + "</p>";

                } else {

                    result.textContent =
                        "Error: " + (data.error || "Unable to check status.");

                }

            } catch (error) {

                result.textContent =
                    "Connection error. Please try again.";

            }

        });
    </script>

</body>
</html>
