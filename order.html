<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #000;
  color: #ffd700;
  padding: 20px 15px;
  min-height: 100vh;
}

.container {
  max-width: 500px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  font-size: 28px;
  margin-bottom: 5px;
  text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

.subtitle {
  text-align: center;
  color: #ffeb80;
  margin-bottom: 25px;
  font-size: 15px;
}

.card {
  background: #111;
  border: 2px solid #ffd700;
  border-radius: 15px;
  padding: 25px 20px;
  margin-bottom: 20px;
  box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
}

.card h2 {
  font-size: 20px;
  margin-bottom: 20px;
  text-align: center;
  color: #fff;
}

label {
  display: block;
  margin: 15px 0 8px;
  font-weight: bold;
  color: #ffeb80;
}

input, select {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 2px solid #444;
  border-radius: 10px;
  background: #222;
  color: #fff;
  outline: none;
}

input:focus, select:focus {
  border-color: #ffd700;
  box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
}

#btnIpadala {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  font-size: 19px;
  font-weight: bold;
  background: linear-gradient(135deg, #ffd700, #ffb300);
  color: #000;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
  transition: all 0.3s ease;
}

#btnIpadala:hover {
  transform: scale(1.03);
  box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
}

#btnIpadala:active {
  transform: scale(0.98);
}

#btnIpadala:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}
</style>

<div class="container">
  <h1>🌹 ROSE SMM PANEL</h1>
  <p class="subtitle">Fast • Secure • Reliable</p>

  <div class="card">
    <h2>📤 Magpadala ng Order</h2>

    <label for="link">🔗 Link ng Post/Video:</label>
    <input type="url" id="link" placeholder="Ilagay ang link dito...">

    <label for="serbisyo">📋 Uri ng Serbisyo:</label>
    <select id="serbisyo">
      <option value="fb_likes">👍 Facebook Likes</option>
      <option value="fb_heart">❤️ Heart Reaction</option>
      <option value="fb_love">😍 Love Reaction</option>
      <option value="fb_wow">😮 Wow Reaction</option>
      <option value="fb_care">🤗 Care Reaction</option>
      <option value="fb_haha">😂 Haha Reaction</option>
      <option value="fb_sad">😢 Sad Reaction</option>
      <option value="fb_angry">😠 Angry Reaction</option>
      <option value="fb_followers">👤 Facebook Followers</option>
      <option value="fb_comments">💬 Facebook Comments</option>
      <option value="fb_shares">🔁 Facebook Shares</option>
      <option value="fb_post_views">👁️ Post Views</option>
      <option value="fb_video_views">▶️ Video Views</option>
    </select>

    <label for="dami">🔢 Bilang / Dami:</label>
    <select id="dami">
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="200">200</option>
      <option value="300">300</option>
      <option value="500">500</option>
      <option value="1000">1,000</option>
      <option value="2000">2,000</option>
      <option value="5000">5,000</option>
      <option value="10000">10,000</option>
      <option value="50000">50,000</option>
      <option value="100000">100,000</option>
      <option value="500000">500,000</option>
      <option value="1000000">1,000,000</option>
    </select>

    <button id="btnIpadala" onclick="ipadalaOrder()">📤 SEND ORDER</button>
  </div>
</div>

<script>
// ==============================================
// SERVICE ID MAP — PALITAN NG TOTOONG MULA SA SMMVALY
// ==============================================
const serviceMap = {
  fb_likes: 1,        // ← Ilagay ang TOTOONG Service ID mula sa SMMValy
  fb_heart: 2,        // ← Palitan
  fb_love: 3,         // ← Palitan
  fb_wow: 4,          // ← Palitan
  fb_care: 5,         // ← Palitan
  fb_haha: 6,         // ← Palitan
  fb_sad: 7,          // ← Palitan
  fb_angry: 8,        // ← Palitan
  fb_followers: 9,    // ← Palitan
  fb_comments: 10,    // ← Palitan
  fb_shares: 11,      // ← Palitan
  fb_post_views: 12,  // ← Palitan
  fb_video_views: 13  // ← Palitan
};

async function ipadalaOrder() {
  const link = document.getElementById('link').value.trim();
  const serbisyo = document.getElementById('serbisyo').value;
  const dami = document.getElementById('dami').value;

  // Suriin kung may kulang
  if (!link) {
    alert("⚠️ Ilagay ang link muna!");
    return;
  }

  const serviceId = serviceMap[serbisyo];
  if (!serviceId) {
    alert("⚠️ Pumili ng serbisyo!");
    return;
  }

  // Pindutan — nagbabago
  const btn = document.getElementById('btnIpadala');
  btn.innerText = "⏰ Sending...";
  btn.disabled = true;

  // Ipadala sa SMMValy + Telegram
  const resulta = await createProviderOrder({
    serviceId: serviceId,
    link: link,
    quantity: dami
  });

  // Resulta
  if (resulta.success) {
    alert("✅ Order Sent Successfully!\nTignan ang Telegram mo!");
    document.getElementById('link').value = ""; // Burahin ang link pagkatapos
  } else {
    alert("❌ Failed!\n" + resulta.message);
  }

  // Balik sa dating anyo
  btn.innerText = "📤 SEND ORDER";
  btn.disabled = false;
}
</script>
