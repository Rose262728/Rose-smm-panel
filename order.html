<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROSE SMM PANEL - Order</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: black;
            color: gold;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 15px;
            margin: 0;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 35px;
        }

        #orderForm {
            width: 100%;
            max-width: 650px;
            margin: auto;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 20px;
            margin: 10px 0;
            font-size: 20px;
            border-radius: 12px;
            border: 2px solid gold;
            text-align: center;
            background: white;
            color: #222;
        }

        button,
        .btn {
            display: block;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            padding: 18px;
            margin: 20px auto;
            font-size: 21px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            background: gold;
            color: black;
            text-decoration: none;
        }

        button:hover,
        .btn:hover {
            background: white;
        }

        @media (max-width: 600px) {
            body {
                padding: 35px 15px;
            }

            h1 {
                font-size: 34px;
            }

            input,
            select {
                font-size: 18px;
                padding: 18px;
            }

            button,
            .btn {
                font-size: 19px;
                padding: 17px;
            }
        }
    </style>
</head>

<body>

    <h1>ROSE SMM PANEL</h1>

    <h2>Place Your Order</h2>

    <form id="orderForm">

        <input
            type="text"
            id="name"
            placeholder="Your Name"
            required
        >

        <input
            type="text"
            id="link"
            placeholder="Facebook/TikTok/YouTube/Instagram Link"
            required
        >

        <select id="country" required>
            <option value="Philippines">🇵🇭 Philippines</option>
            <option value="India">🇮🇳 India</option>
        </select>

        <select id="service" required>

            <optgroup label="Facebook Profile & Page">
                <option value="1">👍 Like</option>
                <option value="2">❤️ Love</option>
                <option value="3">🥰 Care</option>
                <option value="4">😂 Haha</option>
                <option value="5">😮 Wow</option>
                <option value="6">😢 Sad</option>
                <option value="7">😡 Angry</option>
                <option value="8">❤️ All Reactions</option>
                <option value="9">Followers</option>
                <option value="10">Views</option>
                <option value="11">Comments</option>
                <option value="12">Shares</option>
                <option value="13">Saves</option>
            </optgroup>

            <optgroup label="TikTok">
                <option value="14">Likes</option>
                <option value="15">Followers</option>
                <option value="16">Views</option>
                <option value="17">Shares</option>
                <option value="18">Comments</option>
                <option value="19">Saves</option>
            </optgroup>

            <optgroup label="Telegram">
                <option value="20">Members</option>
                <option value="21">Reactions</option>
                <option value="22">Views</option>
                <option value="23">Shares</option>
                <option value="24">Comments</option>
            </optgroup>

            <optgroup label="YouTube">
                <option value="25">Subscribers</option>
                <option value="26">Likes</option>
                <option value="27">Views</option>
                <option value="28">Comments</option>
                <option value="29">Shares</option>
            </optgroup>

            <optgroup label="Instagram">
                <option value="30">Followers</option>
                <option value="31">Likes</option>
                <option value="32">Views</option>
                <option value="33">Comments</option>
                <option value="34">Shares</option>
                <option value="35">Saves</option>
            </optgroup>

        </select>

        <input
            type="number"
            id="quantity"
            placeholder="Quantity"
            min="1"
            required
        >

        <input
            type="number"
            id="runs"
            placeholder="Drip: Ilang beses hahatiin? (opsyonal)"
            min="1"
        >

        <input
            type="number"
            id="interval"
            placeholder="Drip: Pagitan sa bawat oras (opsyonal)"
            min="1"
        >

        <button type="submit">Submit Order</button>

    </form>

    <a href="index.html" class="btn">Back Home</a>

    <script>
        // ⚠️ PALITAN ITO NG TOTOONG DETALYE MULA SA SUPPLIER MO:
        const API_URL =https://smmwiz.com/api/v2
        const API_KEY = "ILAGAY-ANG-API-KEY-MO-DITO";

        document.getElementById("orderForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const link = document.getElementById("link").value.trim();
            const country = document.getElementById("country").value;
            const service = document.getElementById("service").value;
            const quantity = document.getElementById("quantity").value.trim();
            const runs = document.getElementById("runs").value;
            const interval = document.getElementById("interval").value;

            if (!name || !link || !country || !service || !quantity) {
                alert("Punan lahat ng detalye!");
                return;
            }

            try {
                let apiBody = {
                    key: API_KEY,
                    action: "add",
                    service: service,
                    link: link,
                    quantity: quantity
                };

                // Kung may Drip-Feed na ilagay
                if (runs && interval) {
                    apiBody.runs = runs;
                    apiBody.interval = interval;
                }

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(apiBody)
                });

                const data = await response.json();

                if (data.order) {
                    alert(
                        "✅ Order naitala!\n\n" +
                        "Order ID: " + data.order + "\n" +
                        "Salamat, " + name + "!"
                    );
                    document.getElementById("orderForm").reset();
                } else {
                    alert("❌ Error: " + (data.error || "Hindi matagumpay ang order"));
                }

            } catch (error) {
                alert("⚠️ May problema sa koneksyon. Tingnan mo ang API URL at Key.");
                console.error(error);
            }
        });
    </script>

</body>
</html>
